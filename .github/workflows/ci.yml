name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pdf,http]"
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Version consistency check
        run: |
          PKG=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          INIT=$(grep '^__version__' commoner_analyse/__init__.py | sed 's/.*= *"\(.*\)"/\1/')
          echo "pyproject.toml: $PKG  __init__.py: $INIT"
          [ "$PKG" = "$INIT" ] || { echo "Version mismatch"; exit 1; }

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run leak check on tracked files
        run: python3 scripts/check_leaks.py --tracked
